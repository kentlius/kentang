<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kent Liusudarso</title>
  <meta name="description" content="Kent Liusudarso — portfolio and contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', theme || (dark ? 'dark' : 'light'));
        var lang = localStorage.getItem('lang');
        if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
        document.documentElement.setAttribute('data-lang', lang);
        document.documentElement.lang = lang;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="cursor" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <button class="lang-toggle" aria-label="Switch language" type="button">
    <span data-id="en">EN</span>
    <span class="lang-sep">/</span>
    <span data-id="ja">JA</span>
  </button>

  <button class="theme-toggle" aria-label="Toggle theme" type="button">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <main>
    <section class="hero">
      <h1 class="hero-name">Kent <em>Liusudarso</em></h1>
    </section>

    <nav class="icons" aria-label="Links">
      <a class="icon-link" href="mailto:kent.liusudarso@gmail.com" data-label-en="Email" data-label-ja="メール" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      </a>
      <a class="icon-link" href="https://linkedin.com/in/kentlius" target="_blank" rel="noreferrer" data-label-en="LinkedIn" data-label-ja="LinkedIn" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
      <a class="icon-link" href="https://github.com/kentlius" target="_blank" rel="noreferrer" data-label-en="GitHub" data-label-ja="GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.4 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </a>
      <a class="icon-link" href="https://cv.kntl.zip" target="_blank" rel="noreferrer" data-label-en="Curriculum Vitae" data-label-ja="履歴書" aria-label="Curriculum Vitae">

      </a>
    </nav>
  </main>

  <script src="/script.js" defer></script>
</body>
</html>
